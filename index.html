<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffffff">
<title>数学4択クイズ</title>
<style>
  :root {
    --bg: #ffffff; --fg: #0f0f0f; --sub: #606060; --line: #d9d9d9;
    --box: #ececec; --chip: #f2f2f2; --chip-on: #0f0f0f; --chip-on-fg: #fff;
    --ok: #2e7d32; --ok-bg: #e8f5e9; --ng: #c62828; --ng-bg: #ffebee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f0f; --fg: #f1f1f1; --sub: #aaaaaa; --line: #3a3a3a;
      --box: #272727; --chip: #272727; --chip-on: #f1f1f1; --chip-on-fg: #0f0f0f;
      --ok: #66bb6a; --ok-bg: #1b2e1c; --ng: #ef5350; --ng-bg: #3a1d1d;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.6;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line); padding: env(safe-area-inset-top) 0 0;
  }
  .bar { max-width: 720px; margin: 0 auto; padding: 10px 16px 6px; display: flex; align-items: center; gap: 12px; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .score { font-size: 13px; color: var(--sub); text-align: right; white-space: nowrap; }
  .score b { color: var(--fg); font-size: 16px; }
  .chips { max-width: 720px; margin: 0 auto; padding: 4px 16px 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    border: 0; background: var(--chip); color: var(--fg); border-radius: 8px;
    padding: 6px 12px; font-size: 14px; white-space: nowrap; cursor: pointer; font-family: inherit;
  }
  .chip.on { background: var(--chip-on); color: var(--chip-on-fg); }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px 80px; }
  .post { padding: 18px 0 8px; border-bottom: 1px solid var(--line); }
  .head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: #1e88e5; color: #fff; display: grid; place-items: center; font-size: 20px;
  }
  .name { font-weight: 700; font-size: 14px; }
  .meta { color: var(--sub); font-size: 13px; }
  .qtitle { margin: 0 0 2px; }
  .qtext { white-space: pre-wrap; margin: 0 0 12px; }
  .choice {
    display: flex; align-items: center; width: 100%; min-height: 48px; margin: 0 0 10px;
    padding: 10px 16px; border: 1px solid var(--line); border-radius: 2px;
    background: transparent; color: var(--fg); font: inherit; text-align: left; cursor: pointer;
  }
  .choice:not(:disabled):active { background: var(--chip); }
  .choice span { flex: 1; }
  .choice .mark { flex: none; font-weight: 700; margin-left: 12px; display: flex; align-items: center; gap: 6px; }
  .choice:disabled { cursor: default; }
  .choice.correct { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
  .choice.wrong { border-color: var(--ng); color: var(--ng); background: var(--ng-bg); }
  .choice.dim { opacity: .55; }
  .icon { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 14px; }
  .icon.ok { background: var(--ok); } .icon.ng { background: var(--ng); }
  .result { font-size: 14px; color: var(--sub); margin: 2px 4px 10px; }
  .result b.ok { color: var(--ok); } .result b.ng { color: var(--ng); }
  .exp { background: var(--box); padding: 14px 16px; font-size: 14px; margin-bottom: 8px; }
  .exp b { display: block; margin-bottom: 4px; }
  .actions { display: flex; justify-content: flex-end; }
  .link { border: 0; background: none; color: #1e88e5; font: inherit; font-size: 14px; padding: 6px 0; cursor: pointer; }
  .empty { text-align: center; color: var(--sub); padding: 48px 0; }
  .footer { text-align: center; padding: 24px 0; }
  .footer button { margin: 0 6px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>数学4択クイズ</h1>
    <div class="score" id="score"></div>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="feed"></main>

<script src="questions.js"></script>
<script>
(() => {
  const STORE_KEY = "math-quiz-records-v1";
  const CHANNEL = "野球好きな数学教師";

  // 記録: { [問題ID]: { tries, correct, last } }  last = 最後に選んだ番号(1-4)
  let records = {};
  try { records = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(records)); } catch (e) {} };

  // 問題文から安定したIDを作る（問題を並べ替えても記録が残る）
  const idOf = q => {
    let h = 0; const s = q.question + "|" + q.choices.join("|");
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return "q" + (h >>> 0).toString(36);
  };
  const items = QUESTIONS.map((q, i) => ({ ...q, no: i + 1, id: idOf(q) }));

  const categories = [...new Set(items.map(q => q.category))];
  let filter = "すべて";
  let shuffled = false;
  let order = items.slice();

  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function renderScore() {
    const done = items.filter(q => records[q.id] && records[q.id].last);
    const ok = done.filter(q => records[q.id].last === q.answer).length;
    document.getElementById("score").innerHTML =
      `正解 <b>${ok}</b> / ${done.length} 問<br>全 ${items.length} 問`;
  }

  function renderChips() {
    const names = ["すべて", ...categories, "まちがえた問題", "まだ解いていない"];
    const el = document.getElementById("chips");
    el.innerHTML = names.map(n =>
      `<button class="chip ${n === filter ? "on" : ""}" data-f="${esc(n)}">${esc(n)}</button>`).join("") +
      `<button class="chip ${shuffled ? "on" : ""}" data-shuffle>🔀 シャッフル</button>`;
  }

  function visible() {
    return order.filter(q => {
      const r = records[q.id];
      if (filter === "すべて") return true;
      if (filter === "まちがえた問題") return r && r.last && r.last !== q.answer;
      if (filter === "まだ解いていない") return !r || !r.last;
      return q.category === filter;
    });
  }

  function postHTML(q) {
    const r = records[q.id];
    const answered = r && r.last;
    const choices = q.choices.map((c, i) => {
      const n = i + 1;
      let cls = "", mark = "";
      if (answered) {
        if (n === q.answer) { cls = "correct"; mark = `<span class="icon ok">✓</span>正解`; }
        else if (n === r.last) { cls = "wrong"; mark = `<span class="icon ng">✕</span>あなたの回答`; }
        else cls = "dim";
      }
      return `<button class="choice ${cls}" data-q="${q.id}" data-n="${n}" ${answered ? "disabled" : ""}>
        <span>${esc(c)}</span><span class="mark">${mark}</span></button>`;
    }).join("");

    let after = "";
    if (answered) {
      const good = r.last === q.answer;
      after = `
        <div class="result">${good ? '<b class="ok">⭕ 正解！</b>' : '<b class="ng">❌ 不正解…</b>'}
          　これまで ${r.tries} 回中 ${r.correct} 回正解</div>
        <div class="exp"><b>解説</b>${esc(q.explanation)}</div>
        <div class="actions"><button class="link" data-retry="${q.id}">もう一度解く</button></div>`;
    }

    return `<article class="post" id="${q.id}">
      <div class="head">
        <div class="avatar">⚾</div>
        <div><div class="name">${esc(CHANNEL)}</div><div class="meta">${esc(q.category)}</div></div>
      </div>
      <p class="qtitle">Q${q.no}. ${esc(q.category)}</p>
      <p class="qtext">${esc(q.question)}</p>
      ${choices}
      ${after}
    </article>`;
  }

  function renderFeed() {
    const list = visible();
    const feed = document.getElementById("feed");
    feed.innerHTML = list.length
      ? list.map(postHTML).join("") +
        `<div class="footer"><button class="link" data-reset>記録をすべてリセット</button></div>`
      : `<div class="empty">${filter === "まちがえた問題" ? "まちがえた問題はありません 🎉" : "問題がありません"}</div>`;
  }

  function renderAll() { renderScore(); renderChips(); renderFeed(); }

  function replacePost(id) {
    const q = items.find(x => x.id === id);
    const el = document.getElementById(id);
    if (el) el.outerHTML = postHTML(q);
    renderScore();
  }

  document.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;

    if (t.dataset.f) { filter = t.dataset.f; renderChips(); renderFeed(); window.scrollTo(0, 0); return; }

    if ("shuffle" in t.dataset) {
      shuffled = !shuffled;
      order = items.slice();
      if (shuffled) for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]];
      }
      renderChips(); renderFeed(); window.scrollTo(0, 0); return;
    }

    if (t.dataset.q) {
      const q = items.find(x => x.id === t.dataset.q);
      const n = Number(t.dataset.n);
      const r = records[q.id] || { tries: 0, correct: 0, last: 0 };
      r.tries++; if (n === q.answer) r.correct++; r.last = n;
      records[q.id] = r; save();
      if (navigator.vibrate) navigator.vibrate(n === q.answer ? 30 : [60, 40, 60]);
      replacePost(q.id); return;
    }

    if (t.dataset.retry) {
      const r = records[t.dataset.retry]; if (r) r.last = 0; save();
      replacePost(t.dataset.retry); return;
    }

    if ("reset" in t.dataset) {
      if (confirm("すべての回答記録を消しますか？")) { records = {}; save(); renderAll(); }
    }
  });

  renderAll();
})();
</script>
</body>
</html>
